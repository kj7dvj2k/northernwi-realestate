name: wi-stats
# Rewrites stats/wi-stats.json (county and zip numbers for the AgentFire site's Wisconsin maps) every 15 minutes.
# The site reads it from raw.githubusercontent.com; when the file is missing or over 4 hours old the browser pulls the
# listing feed itself, as before.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wi-stats
  cancel-in-progress: false
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/wi-stats.mjs
      - name: commit if changed
        run: |
          if [ -n "$(git status --porcelain stats/wi-stats.json)" ]; then
            git config user.name "wi-stats"
            git config user.email "wi-stats@users.noreply.github.com"
            git add stats/wi-stats.json
            git commit -m "wi-stats $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
